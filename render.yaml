services:
  - type: web
    name: daylight-ai
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: daylight-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APP_ORIGIN
        sync: false
      - key: APP_PASSWORD
        generateValue: true
      - key: VAPID_SUBJECT
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: MS_TENANT_ID
        value: organizations
